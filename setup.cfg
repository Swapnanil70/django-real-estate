[flake8]
max-line-length = 119
exclude = .git,__pycache__,docs/source/conf.py,old,build,dist,venv,.venv,.tox,*/migrations/*,*/static/CACHE/*,docs/*,*/staticfiles/*,*/mediafiles/*

[coverage:run]
source =  .
omit=
    *apps.py,
    *settings.py,
    *urls.py,
    *wsgi.py,
    *asgi.py,
    manage.py,
    conftest.py,
    *base.py,
    *development.py,
    *production.py,
    *__init__.py,
    */migrations/*,
    *tests/*,
    */env/*,
    */venv/*,
[coverage:report]
show_missing = True